name: Test Suite

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "**.swift"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.swift"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/tests.yml"
  schedule:
    # The integration suites are excluded from the stable unit-test run (see
    # docs/testing.md); this nightly run is what exercises them.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  macos_unit_tests:
    name: macOS Unit Tests
    # The nightly schedule exists to exercise the integration suites below.
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Clear SPM artifacts cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      # The suite is written for serial execution: suites share @MainActor
      # singletons (SongLikeStatusManager's cache and rating knobs) that their
      # setups clear, and several tests wait on fixed sleeps. Run in parallel
      # and one suite's setup lands inside another's awaits, which is how this
      # job used to fail on tests that pass in isolation.
      # The environment-dependent suites are excluded: MusicIntentIntegrationTests
      # because its Apple Intelligence output is non-deterministic (the
      # integration job below runs it), and CanvasVideoViewTests because it needs
      # real AVFoundation playback. docs/testing.md documents both as never
      # gating a merge or a release. A single retry absorbs a residual timing
      # flake on a busy runner; a real failure still fails both attempts.
      - name: Run unit tests
        run: |
          set -uo pipefail
          SKIP="KasetUITests|MusicIntentIntegrationTests|CanvasVideoViewTests"
          for attempt in 1 2; do
            echo "::group::swift test (attempt $attempt of 2)"
            if swift test -q --no-parallel --skip "$SKIP"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Unit tests failed on the first attempt; retrying once."
            fi
          done
          echo "::error::Unit tests failed on both attempts."
          exit 1

  macos_integration_tests:
    name: macOS Integration Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Clear SPM artifacts cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      # LLM output is non-deterministic, so these are never a merge gate: they
      # run nightly and on demand, and may need a re-run. See docs/testing.md.
      - name: Run integration tests
        run: 'swift test -q --no-parallel --filter "MusicIntentIntegrationTests"'

  macos_ui_tests:
    name: macOS UI Tests
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Clear SPM artifacts cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      - name: Build app bundle for UI tests
        env:
          KASET_SIGNING: adhoc
        run: Scripts/build-app.sh debug

      - name: Install app for UI tests
        run: |
          sudo cp -R .build/app/Kaset.app /Applications/Kaset.app
          # Register with Launch Services so XCUIApplication can find it
          /System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister -f /Applications/Kaset.app

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project KasetUITests.xcodeproj \
            -scheme KasetUITests \
            -destination 'platform=macOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: macOS-UITestResults
          path: ./build/*.xcresult
          retention-days: 7
