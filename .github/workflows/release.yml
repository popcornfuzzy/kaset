name: Release Build

# A tag is the only thing that starts a release. A manual run has to name the tag
# it rebuilds: a dispatch on a branch has no version of its own, and an earlier
# revision of this file took the branch name as the version, which published a
# release named "main" carrying a sparkle:shortVersionString of "main".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, for example v0.8.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and draft the release
    runs-on: macos-26
    timeout-minutes: 60

    env:
      # Point the packaged app at this repository's feed so a rename cannot ship
      # an app that asks the wrong appcast for updates.
      KASET_SU_FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/appcast.xml

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0 # full history, for --generate-notes

      - name: Resolve and validate the release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          # Reject anything that cannot become a CFBundleShortVersionString
          # before a single artifact is produced.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected vMAJOR.MINOR[.PATCH], optionally with a -prerelease suffix)."
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' does not exist in this repository."
            exit 1
          fi

          # A run started before the tag was moved would otherwise publish the
          # wrong commit, so compare the checkout against the tag itself.
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          HEAD_COMMIT=$(git rev-parse "HEAD^{commit}")
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checked out $HEAD_COMMIT but tag $TAG points at $TAG_COMMIT."
            exit 1
          fi

          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $TAG (version $VERSION, prerelease=$PRERELEASE)"

      - name: Select Xcode
        run: |
          set -euo pipefail
          PREFERRED="/Applications/Xcode_26.2.app/Contents/Developer"
          if [ -d "$PREFERRED" ]; then
            sudo xcode-select -s "$PREFERRED"
          else
            # Runner images move Xcode versions; the installed default still
            # builds this package, so use it instead of failing the release.
            echo "::warning::Xcode 26.2 is not installed on this runner; using the default."
            ls -d /Applications/Xcode*.app || true
          fi
          xcode-select -p
          swift --version

      - name: Clear SPM artifacts cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      - name: Run unit tests
        run: |
          set -uo pipefail

          # Serial execution: the suite shares @MainActor singletons and several
          # tests wait on fixed timings. See docs/testing.md.
          #
          # The environment-dependent suites are excluded. They need Apple
          # Intelligence or real AVFoundation playback and are documented as never
          # gating a release (docs/testing.md). What is left is deterministic, and
          # a single retry absorbs a residual timing flake on a busy runner: a real
          # failure still fails both attempts.
          SKIP="KasetUITests|MusicIntentIntegrationTests|CanvasVideoViewTests"

          for attempt in 1 2; do
            echo "::group::swift test (attempt $attempt of 2)"
            if swift test -q --no-parallel --skip "$SKIP"; then
              echo "::endgroup::"
              echo "Unit tests passed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Unit tests failed on the first attempt; retrying once."
            fi
          done

          echo "::error::Unit tests failed on both attempts."
          exit 1

      - name: Set up the code signing identity
        id: signing
        env:
          KASET_SIGNING_P12: ${{ secrets.KASET_SIGNING_P12 }}
          KASET_SIGNING_P12_PASSWORD: ${{ secrets.KASET_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          IDENTITY=$(Scripts/import-signing-identity.sh)
          if [ -z "$IDENTITY" ]; then
            echo "::warning::No signing identity is configured, so this release is ad-hoc signed: macOS will ask for Keychain access again after every install, because an ad-hoc signature's designated requirement is a cdhash that changes on every build. Add KASET_SIGNING_P12 and KASET_SIGNING_P12_PASSWORD to fix that. See docs/adr/0027-stable-code-signing-identity.md."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=identity" >> "$GITHUB_OUTPUT"
            echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release app
        env:
          KASET_SIGNING: ${{ steps.signing.outputs.mode }}
          APP_IDENTITY: ${{ steps.signing.outputs.identity }}
          ARCHES: "arm64 x86_64"
        run: |
          set -euo pipefail
          printf 'MARKETING_VERSION=%s\nBUILD_NUMBER=%s\n' \
            "${{ steps.version.outputs.version }}" "$GITHUB_RUN_NUMBER" > version.env
          Scripts/build-app.sh release

      - name: Verify the packaged app
        run: |
          set -euo pipefail
          APP=".build/app/Kaset.app"
          PLIST="$APP/Contents/Info.plist"
          BIN="$APP/Contents/MacOS/Kaset"

          if [ ! -d "$APP" ]; then
            echo "::error::$APP was not produced."
            exit 1
          fi

          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          EXPECTED_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PLIST_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Packaged version '$PLIST_VERSION' does not match the tag's '$EXPECTED_VERSION'."
            exit 1
          fi

          ARCHS=$(lipo -archs "$BIN")
          for arch in arm64 x86_64; do
            if [[ "$ARCHS" != *"$arch"* ]]; then
              echo "::error::Kaset is missing the $arch slice (found: $ARCHS)."
              exit 1
            fi
          done

          # Without a public key the shipped app could never accept an update,
          # and the feed step would produce an unsigned item.
          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c "Print SUPublicEDKey" "$PLIST")
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::The packaged app has no SUPublicEDKey, so no update would ever install."
            exit 1
          fi

          # Kaset is sandboxed, so Sparkle can only install an update through its
          # Installer service. Losing either the key below or the Mach service
          # exceptions in the entitlements still lets the update download and then
          # fails at install time, which no unit test would catch.
          INSTALLER_SERVICE=$(/usr/libexec/PlistBuddy -c "Print SUEnableInstallerLauncherService" "$PLIST" 2>/dev/null || echo "")
          if [ "$INSTALLER_SERVICE" != "true" ]; then
            echo "::error::The packaged app does not set SUEnableInstallerLauncherService, so a sandboxed install would fail after downloading."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$PLIST")
          ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -convert xml1 -o - - 2>/dev/null || true)
          if [ -z "$ENTITLEMENTS" ]; then
            ENTITLEMENTS=$(codesign -d --entitlements - "$APP" 2>/dev/null || true)
          fi
          for service in "-spks" "-spki"; do
            if [[ "$ENTITLEMENTS" != *"${BUNDLE_ID}${service}"* ]]; then
              echo "::error::The packaged app is missing the ${BUNDLE_ID}${service} mach-lookup exception, so Sparkle's installer service would be unreachable inside the sandbox."
              exit 1
            fi
          done

          # The Sparkle helpers are re-signed by Scripts/build-app.sh; make sure the
          # nested signatures still verify, since a broken nested signature is
          # another install-time-only failure.
          codesign --verify --deep --strict "$APP" || {
            echo "::error::The packaged app or its nested code failed signature verification."
            exit 1
          }

          echo "Kaset $PLIST_VERSION ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")) for $ARCHS"
          echo "Feed: $(/usr/libexec/PlistBuddy -c 'Print SUFeedURL' "$PLIST")"

      - name: Install create-dmg
        # Optional: Scripts/create-dmg.sh falls back to hdiutil when this fails.
        continue-on-error: true
        run: brew install create-dmg

      - name: Determine the download name
        id: artifact
        run: |
          set -euo pipefail
          echo "filename=kaset-${{ steps.version.outputs.tag }}.dmg" >> "$GITHUB_OUTPUT"

      - name: Create the DMG
        run: |
          set -euo pipefail
          Scripts/create-dmg.sh "${{ steps.artifact.outputs.filename }}" .build/app/Kaset.app

      - name: Upload the DMG artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ${{ steps.artifact.outputs.filename }}
          retention-days: 30

      - name: Create or update the draft release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.artifact.outputs.filename }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            echo "Release $TAG already exists (draft=$DRAFT); replacing its $FILE asset."
            gh release upload "$TAG" "$FILE" --clobber

            if [ "$DRAFT" = "false" ]; then
              echo "state=republished" >> "$GITHUB_OUTPUT"
              echo "::warning::Release $TAG is already published, so the feed still carries the previous build's signature. Run the 'Update Appcast' workflow for $TAG."
            else
              echo "state=draft-updated" >> "$GITHUB_OUTPUT"
            fi
          else
            PRERELEASE_FLAG=""
            if [ "$PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" "$FILE" \
              --title "$TAG" \
              --draft \
              --generate-notes \
              ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"}
            echo "state=draft-created" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.artifact.outputs.filename }}
          STATE: ${{ steps.publish.outputs.state }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 "$FILE" | awk '{print $1}')
          {
            echo "## $TAG"
            echo ""
            echo "- DMG: \`$FILE\` ($(stat -f%z "$FILE") bytes)"
            echo "- SHA-256: \`$SHA\`"
            echo "- Release state: \`$STATE\`"
            echo ""
            if [ "$STATE" = "republished" ]; then
              echo "This tag was already published, so the feed still advertises the previous build."
              echo "Run the **Update Appcast** workflow for \`$TAG\` to re-sign the new DMG."
            else
              echo "The release is a **draft**. Publishing it runs the **Update Appcast** workflow, which"
              echo "signs the DMG and commits the feed. An update is only advertised once its download URL"
              echo "is public, which is why the feed is not touched while the release is a draft."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary keychain
        if: always()
        run: Scripts/import-signing-identity.sh --cleanup
